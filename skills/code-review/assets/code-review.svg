<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Code Review</title>
  <desc id="description">Иллюстрация проверки кода: окно редактора, лупа и подтверждённые пункты.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="76" r="120" fill="#5eead4" opacity=".1"/>
  <circle cx="104" cy="374" r="150" fill="#93c5fd" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="86" y="70" width="580" height="280" rx="18" fill="#f8fafc"/>
    <rect x="86" y="70" width="580" height="48" rx="18" fill="#e2e8f0"/>
    <circle cx="118" cy="94" r="7" fill="#f87171"/>
    <circle cx="142" cy="94" r="7" fill="#fbbf24"/>
    <circle cx="166" cy="94" r="7" fill="#34d399"/>
    <path d="M132 160h34l20 20-20 20h-34M244 152l-26 58M282 160h34l20 20-20 20h-34" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="240" width="410" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="132" y="275" width="344" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="132" y="310" width="270" height="12" rx="6" fill="#cbd5e1"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="684" cy="228" r="86" fill="#ffffff" fill-opacity=".94" stroke="#5eead4" stroke-width="14"/>
    <path d="M747 291l76 76" stroke="#5eead4" stroke-width="26" stroke-linecap="round"/>
    <path d="M646 228l25 25 52-58" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="862" y="168" fill="#ffffff" font-family="system-ui, sans-serif" font-size="48" font-weight="700">CODE</text>
  <text x="862" y="226" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="48" font-weight="700">REVIEW</text>
  <text x="864" y="274" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="20">Факты • Риски • Рекомендации</text>
</svg>
